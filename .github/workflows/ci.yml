name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Installs the library and demo/ together (pnpm-workspace.yaml).
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run ci
      - run: pnpm --filter worlds-kit-demo run build
